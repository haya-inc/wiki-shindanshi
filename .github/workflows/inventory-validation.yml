name: Validate updated wiki tooling
'on':
  push:
    branches:
    - codex/validate-inventory-20261128
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
    - name: Resolve compatible linter and compiler peers
      run: 'pnpm update --lockfile-only --ignore-scripts typescript@^${{ matrix.ts }} eslint@^${{ matrix.eslint }} eslint-plugin-mdx@^3.10.1

        pnpm update --depth=5 --lockfile-only --ignore-scripts typescript-eslint

        pnpm install --frozen-lockfile

        '
    - run: pnpm lint
    - run: pnpm build
      env:
        NEXT_TELEMETRY_DISABLED: '1'
    - run: git diff -- package.json pnpm-lock.yaml > "$RUNNER_TEMP/dependencies.patch"
    - uses: actions/upload-artifact@v7
      with:
        name: compatible-${{ matrix.ts }}-${{ matrix.eslint }}
        path: ${{ runner.temp }}/dependencies.patch
        retention-days: 1
    strategy:
      fail-fast: false
      matrix:
        include:
        - ts: 6.0.3
          eslint: 10.16.0
        - ts: 6.0.3
          eslint: 9.39.4
        - ts: 5.9.3
          eslint: 9.39.4
