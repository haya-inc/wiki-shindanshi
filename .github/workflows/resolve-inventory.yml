name: Resolve inventory dependencies
'on':
  push:
    branches:
    - codex/resolve-inventory-20261128
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      with:
        version: 10.33.0
    - name: Resolve listed dependencies using the project policy
      shell: python
      run: "import json\nfrom pathlib import Path\nfrom subprocess import run\ntargets = {'.': {'@playwright/test': '1.65.1', 'eslint': '10.15.0', 'react': '19.3.1', 'react-dom': '19.3.1', 'typescript': '7.0.2', 'zod': '4.6.7', 'eslint-config-next': '16.4.6'}}\nfor root, packages in targets.items():\n    p = Path(root, 'package.json')\n    text = p.read_text()\n    data = json.loads(text)\n    for group in ('dependencies', 'devDependencies'):\n        for name, version in packages.items():\n            current = data.get(group, {}).get(name)\n            if current is None:\n                continue\n            spec = (current[0] if current[0] in '^~' else '') + version\n            current_entry = json.dumps(name) + ': ' + json.dumps(current)\n            assert text.count(current_entry) == 1\n            text = text.replace(current_entry, json.dumps(name) + ': ' + json.dumps(spec))\n    p.write_text(text)\n    run(['pnpm', 'install', '--no-frozen-lockfile', '--lockfile-only', '--ignore-scripts'],\
        \ cwd=root, check=True)\n    run(['pnpm', 'install', '--frozen-lockfile', '--lockfile-only', '--ignore-scripts'], cwd=root, check=True)\n"
    - name: Save the dependency changes
      run: 'git diff -- package.json pnpm-lock.yaml > "$RUNNER_TEMP/dependencies.patch"

        test -s "$RUNNER_TEMP/dependencies.patch"'
    - uses: actions/upload-artifact@v7
      with:
        name: dependency-update
        path: ${{ runner.temp }}/dependencies.patch
        retention-days: 1
